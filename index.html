<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q.ualityA.ssurance</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }

    /* ヘッダー全体 */
    .split-header {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      height: 100px;
      display: flex;
      align-items: center;
      z-index: 2000;
    }

    .header-left,
    .header-right {
      height: 100%;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .header-left {
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }

    .header-right {
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .header-center {
      flex: 1;
      height: 100%;
      display: flex;
      overflow: hidden;
    }

    .split-header img {
      height: 100%;
      width: auto;
      display: block;
      margin: 0;
      padding: 0;
    }

    /* ロゴのコンテナ */
    .logo-container {
      position: absolute;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      height: 70%;
      display: flex;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .logo-container img {
      height: 100%;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>

  <header class="split-header">
    <!-- 左側パーツ -->
    <div class="header-left">
      <img src="material/header_left.png" alt="Header Left">
    </div>

    <!-- 中央パーツ -->
    <div class="header-center" id="headerCenter"></div>

    <!-- 右側パーツ -->
    <div class="header-right">
      <img src="material/header_right.png" alt="Header Right">
    </div>

    <!-- ロゴパーツ -->
    <div class="logo-container">
      <img src="material/yoko_logo_1.png" alt="Logo Part 1">
      <img src="material/yoko_logo_2.png" alt="Logo Part 2">
      <img src="material/yoko_logo_3.png" alt="Logo Part 3">
    </div>
  </header>

  <script>
    function fillHeaderCenter() {
      const container = document.getElementById('headerCenter');
      const imgPath = 'material/header.png';
      
      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;
      
      const imgWidth = containerHeight * (16 / 9);
      const count = Math.ceil(containerWidth / imgWidth) + 1;
      
      container.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const img = document.createElement('img');
        img.src = imgPath;
        img.alt = 'Header Center';
        container.appendChild(img);
      }
    }

    window.addEventListener('load', fillHeaderCenter);
    window.addEventListener('resize', fillHeaderCenter);
  </script>

</body>
</html>
